<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>wave-method: two waves, three features</title>
  <style>
    svg { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#8c959f; --band:#f0f6ff;
          --run:#0969da; --main:#1a7f37; --f1:#8250df; --f2:#bf8700; --f3:#0969da; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#6e7681; --band:#0f1d33;
            --run:#4493f8; --main:#3fb950; --f1:#ab7df8; --f2:#d29922; --f3:#4493f8; }
    }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .t { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .h { fill: var(--fg); font-size: 16px; font-weight: 700; }
    .d { fill: var(--muted); font-size: 12.5px; }
    .m { fill: var(--fg); font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .task { fill: var(--card); stroke-width: 2; }
    .lane { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 5; }
    .wait { stroke: var(--f2); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .mrg { stroke-width: 2.5; fill: none; }
  </style>
  <rect class="bg" width="960" height="450"/>

  <rect class="band" x="190" y="30" width="270" height="290" rx="12"/>
  <rect class="band" x="540" y="30" width="230" height="290" rx="12"/>
  <text class="h" x="325" y="56" text-anchor="middle">Wave 1</text>
  <text class="m" x="325" y="76" text-anchor="middle">/wave-run &lt;plan&gt; 1</text>
  <text class="h" x="655" y="56" text-anchor="middle">Wave 2</text>
  <text class="m" x="655" y="76" text-anchor="middle">/wave-run &lt;plan&gt; 2</text>

  <!-- lanes -->
  <text class="t" x="30" y="125" style="fill:var(--f1)">F1</text><text class="d" x="58" y="125">login test</text>
  <text class="t" x="30" y="195" style="fill:var(--f2)">F2</text><text class="d" x="58" y="195">CSV export</text>
  <text class="t" x="30" y="265" style="fill:var(--f3)">F3</text><text class="d" x="58" y="265">cache TTL</text>
  <line class="lane" x1="150" y1="120" x2="880" y2="120"/>
  <line class="lane" x1="150" y1="190" x2="880" y2="190"/>
  <line class="lane" x1="150" y1="260" x2="880" y2="260"/>

  <!-- tasks -->
  <rect class="task" x="215" y="100" width="220" height="40" rx="8" style="stroke:var(--f1)"/>
  <text class="t" x="231" y="125">Task A</text><text class="d" x="419" y="125" text-anchor="end">fix flaky test</text>
  <rect class="task" x="215" y="170" width="220" height="40" rx="8" style="stroke:var(--f2)"/>
  <text class="t" x="231" y="195">Task B</text><text class="d" x="419" y="195" text-anchor="end">export service</text>
  <rect class="task" x="215" y="240" width="220" height="40" rx="8" style="stroke:var(--f3)"/>
  <text class="t" x="231" y="265">Task C</text><text class="d" x="419" y="265" text-anchor="end">rename config key</text>
  <rect class="task" x="565" y="170" width="180" height="40" rx="8" style="stroke:var(--f2)"/>
  <text class="t" x="581" y="195">Task D</text><text class="d" x="729" y="195" text-anchor="end">export button</text>

  <!-- F2 waits -->
  <path class="wait" d="M437,190 H561"/>
  <text class="d" x="499" y="182" text-anchor="middle" style="fill:var(--f2)">waits</text>

  <!-- main -->
  <line x1="150" y1="360" x2="910" y2="360" style="stroke:var(--main);stroke-width:4"/>
  <text class="t" x="30" y="365" style="fill:var(--main)">main</text>
  <path class="mrg" d="M437,120 C490,120 490,300 495,352" style="stroke:var(--f1)"/>
  <path class="mrg" d="M437,260 C480,260 490,320 495,352" style="stroke:var(--f3)"/>
  <circle cx="495" cy="360" r="8" style="fill:var(--main)"/>
  <text class="d" x="495" y="388" text-anchor="middle">F1 + F3 merged after review</text>
  <path class="mrg" d="M747,190 C800,190 805,300 810,352" style="stroke:var(--f2)"/>
  <circle cx="810" cy="360" r="8" style="fill:var(--main)"/>
  <text class="d" x="810" y="388" text-anchor="middle">F2 merged after review</text>

  <text class="d" x="480" y="430" text-anchor="middle">Tasks of one wave share no files, so they run at once · a finished feature reaches main only after your review</text>
</svg>
